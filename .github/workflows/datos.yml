name: 🤖 Actualizar datos diarios

# A las 12:00 y cada hora de 17:00 a 01:00, hora de España (cuando acaban
# los partidos). GitHub solo entiende UTC y España cambia de hora (UTC+2 en
# verano, UTC+1 en invierno): se programan las horas UTC de las dos épocas y el
# trabajo «hora» deja seguir solo las que caen en esas horas de España.
on:
  schedule:
    - cron: '1 0 * * *'
    - cron: '1 10 * * *'
    - cron: '1 11 * * *'
    - cron: '1 15 * * *'
    - cron: '1 16 * * *'
    - cron: '1 17 * * *'
    - cron: '1 18 * * *'
    - cron: '1 19 * * *'
    - cron: '1 20 * * *'
    - cron: '1 21 * * *'
    - cron: '1 22 * * *'
    - cron: '1 23 * * *'
  workflow_dispatch:        # también se puede lanzar manualmente desde GitHub

# Nunca dos ejecuciones a la vez: evita conflictos al hacer push
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.comprobar.outputs.toca }}
    steps:
      - name: ¿Es la hora de España que toca?
        id: comprobar
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "toca=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          utc=$(echo "${{ github.event.schedule }}" | awk '{print $2}')
          desfase=$(TZ=Europe/Madrid date +%z | cut -c2-3)   # 02 en verano, 01 en invierno
          madrid=$(( (10#$utc + 10#$desfase) % 24 ))
          case " 12 17 18 19 20 21 22 23 0 1 " in
            *" $madrid "*) toca=1 ;;
            *) toca=0 ;;
          esac
          echo "Programada a las $utc UTC = $madrid h en España -> toca=$toca"
          echo "toca=$toca" >> "$GITHUB_OUTPUT"

  scrape:
    needs: hora
    if: needs.hora.outputs.toca == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Si el código de los scrapers está roto, mejor no tocar los datos
      - name: Pruebas de los scrapers
        run: python -m unittest discover tests

      # Primero los resultados: así el scraper todavía lee la cartelera de
      # ayer y puede saber la competición de los partidos que la web no dice.
      # Un fallo en un scraper no debe impedir que se guarde lo del otro.
      - name: Scraper de resultados
        id: resultados
        run: python scraper/scraper.py
        continue-on-error: true

      - name: Scraper de cartelera
        id: cartelera
        run: python scraper/scraper_cartelera.py
        continue-on-error: true

      # Si los datos no son coherentes no se publican
      - name: Validar datos
        run: python tools/validar_datos.py

      # Páginas estáticas de cada pelotari (para los buscadores) y sitemap
      - name: Generar páginas estáticas (pelotaris, competiciones, frontones)
        run: python tools/generar_paginas.py

      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ pelotari/ competicion/ fronton/ eu/ sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "🤖 Actualizar datos - $(TZ=Europe/Madrid date +'%d/%m/%Y %H:%M')"
            git push
          fi

      # Porra: sube la cartelera a Supabase y cierra los partidos jugados.
      # Sin el secreto SUPABASE_SECRET_KEY solo muestra lo que haría.
      - name: Porra
        id: porra
        run: python tools/porra.py
        continue-on-error: true
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      # Marca la ejecución en rojo si algún scraper falló, tras guardar lo que sí funcionó
      - name: Comprobar scrapers
        if: steps.cartelera.outcome == 'failure' || steps.resultados.outcome == 'failure' || steps.porra.outcome == 'failure'
        run: |
          echo "cartelera: ${{ steps.cartelera.outcome }} · resultados: ${{ steps.resultados.outcome }} · porra: ${{ steps.porra.outcome }}"
          exit 1
