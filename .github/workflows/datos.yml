name: 🤖 Actualizar datos diarios

# A las 00:00 y a las 12:00 de España. GitHub solo entiende la hora UTC y
# España cambia de hora (UTC+2 en verano, UTC+1 en invierno): se programan las
# dos posibilidades y el trabajo «hora» deja seguir solo la que toca hoy.
on:
  schedule:
    - cron: '1 22 * * *'   # 00:01 en verano
    - cron: '1 10 * * *'   # 12:01 en verano
    - cron: '1 23 * * *'   # 00:01 en invierno
    - cron: '1 11 * * *'   # 12:01 en invierno
  workflow_dispatch:        # también se puede lanzar manualmente desde GitHub

# Nunca dos ejecuciones a la vez: evita conflictos al hacer push
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.comprobar.outputs.toca }}
    steps:
      - name: ¿Es la hora de España que toca?
        id: comprobar
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "toca=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          desfase=$(TZ=Europe/Madrid date +%z)   # +0200 en verano, +0100 en invierno
          case "$desfase|${{ github.event.schedule }}" in
            "+0200|1 22 * * *"|"+0200|1 10 * * *"|"+0100|1 23 * * *"|"+0100|1 11 * * *") toca=1 ;;
            *) toca=0 ;;
          esac
          echo "Desfase $desfase, programación '${{ github.event.schedule }}' -> toca=$toca"
          echo "toca=$toca" >> "$GITHUB_OUTPUT"

  scrape:
    needs: hora
    if: needs.hora.outputs.toca == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Si el código de los scrapers está roto, mejor no tocar los datos
      - name: Pruebas de los scrapers
        run: python -m unittest discover tests

      # Primero los resultados: así el scraper todavía lee la cartelera de
      # ayer y puede saber la competición de los partidos que la web no dice.
      # Un fallo en un scraper no debe impedir que se guarde lo del otro.
      - name: Scraper de resultados
        id: resultados
        run: python scraper/scraper.py
        continue-on-error: true

      - name: Scraper de cartelera
        id: cartelera
        run: python scraper/scraper_cartelera.py
        continue-on-error: true

      # Si los datos no son coherentes no se publican
      - name: Validar datos
        run: python tools/validar_datos.py

      # Páginas estáticas de cada pelotari (para los buscadores) y sitemap
      - name: Generar páginas de pelotaris
        run: python tools/generar_paginas.py

      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ pelotari/ eu/ sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "🤖 Actualizar datos - $(TZ=Europe/Madrid date +'%d/%m/%Y %H:%M')"
            git push
          fi

      # Marca la ejecución en rojo si algún scraper falló, tras guardar lo que sí funcionó
      - name: Comprobar scrapers
        if: steps.cartelera.outcome == 'failure' || steps.resultados.outcome == 'failure'
        run: |
          echo "cartelera: ${{ steps.cartelera.outcome }} · resultados: ${{ steps.resultados.outcome }}"
          exit 1
