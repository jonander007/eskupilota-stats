name: 📚 Historial de Baiko

# Importa el «Historial de competición» de las fichas de campeonato de Baiko
# (data/historial_baiko.json): fase real de cada partido, partidos mal
# clasificados y partidos que falten. Se lanza a mano desde GitHub (Actions).
# Con «aplicar» desmarcado solo muestra el informe, sin cambiar nada.
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Guardar los cambios (si no, solo el informe)'
        type: boolean
        default: false

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  historial:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Informe (sin cambios)
        if: ${{ !inputs.aplicar }}
        run: python tools/importar_historial.py --dry-run --lista data/historial_baiko.json

      - name: Importar
        if: ${{ inputs.aplicar }}
        run: |
          python tools/importar_historial.py --lista data/historial_baiko.json
          python tools/recalcular_contadores.py
          python tools/validar_datos.py
          python tools/generar_paginas.py

      - name: Guardar cambios
        if: ${{ inputs.aplicar }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ pelotari/ competicion/ fronton/ eu/ sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "📚 Historial de campeonatos de Baiko"
            git push
          fi
